# =============================================================================
# Section 3 — @abstractmethod contract overrides
# =============================================================================
# WHY: `BaseSLM(ABC)` declares `@abstractmethod def get_confidence(...)`.
# Every concrete subclass MUST override `get_confidence` or Python raises
# `TypeError: Can't instantiate abstract class ... with abstract method
# get_confidence` at instantiation time. The override is therefore a
# CONTRACT obligation, not "dead code" — even though no `.get_confidence()`
# call site exists today.
#
# VERIFICATION (Task 4c-VULTURE):
#   - The @abstractmethod declaration itself lives at:
#       scp/runtime/slm_base.py:69
#     (class BaseSLM(ABC))
#   - 72 reports total: 1 abstract declaration + 71 concrete overrides
#     across all subclasses in scp/runtime/slms_parts/* and
#     scp/runtime/slm_impls/*. All concrete subclasses verified to inherit
#     from BaseSLM (script: /tmp/check_get_conf.py).
#   - NOTE: `predict` (the OTHER abstractmethod) is correctly NOT flagged
#     by vulture because `slm.predict(question)` IS called explicitly in
#     scp/runtime/judge_parts/judgecore_mixin.py:600. Only `get_confidence`
#     has no explicit call site.
# -----------------------------------------------------------------------------
get_confidence


# =============================================================================
# Section 4 — PEP 562 module-level __getattr__ (lazy import)
# =============================================================================
# WHY: Python 3.7+ (PEP 562) allows modules to define a module-level
# `__getattr__` function that the import system calls whenever an attribute
# lookup misses on the module object. Vulture cannot see this implicit call.
#
# VERIFICATION (Task 4c-VULTURE):
#   scp/core/__init__.py:23 — module-level `def __getattr__(name):` that
#   lazy-imports Phase0Store, EvidenceStore, ConclusionStore,
#   ReasonChainStore, EvidenceLinkStore, ChainStateService, db_exec,
#   HypothesisZone, RealityAnchor, AntibodyEngine. The names are listed in
#   `__all__` and imported elsewhere via `from scp.core import X`.
# -----------------------------------------------------------------------------
__getattr__


