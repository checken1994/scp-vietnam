# =============================================================================
# Section 1 — ast.NodeVisitor dynamic dispatch
# =============================================================================
# WHY: Methods named `visit_<NodeName>` on subclasses of `ast.NodeVisitor`
# are invoked by the Python `ast` framework via reflection — the framework
# looks up `self.visit_<type(node).__name__>` for every AST node visited.
# They are NEVER called explicitly anywhere in the codebase.
#
# VERIFICATION (Task 4c-VULTURE):
#   All 9 reports are in classes that subclass `ast.NodeVisitor`:
#     scp/autofix/runner_phases/ast_scan.py:
#       class _ModuleNameCollector(ast.NodeVisitor)  -> visit_AnnAssign, visit_NamedExpr
#       class _UndefinedNameFinder(ast.NodeVisitor)  -> visit_AnnAssign, visit_NamedExpr
#     scp/autofix/scanners/dead_slm_scanner.py:
#       class _SLMInitCollector(ast.NodeVisitor)     -> visit_AnnAssign
#     scp/autofix/scanners/null_safety_scanner.py:
#       class _NullDerefFinder(ast.NodeVisitor)      -> visit_AnnAssign
#     scp/autofix/scanners/resource_leak_scanner.py:
#       class _ResourceLeakFinder(ast.NodeVisitor)   -> visit_AnnAssign
#     scp/autofix/scanners/type_contract_scanner.py:
#       class _TypeMisuseFinder(ast.NodeVisitor)     -> visit_AnnAssign
#     scp/autofix/scanners/xss_scanner.py:
#       class _XSSFinder(ast.NodeVisitor)            -> visit_JoinedStr
# -----------------------------------------------------------------------------
visit_AnnAssign
visit_JoinedStr
visit_NamedExpr


