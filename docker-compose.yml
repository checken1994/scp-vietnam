version: '3.8'

services:
  scp:
    build: .
    container_name: scp
    restart: unless-stopped
    volumes:
      - scp_data:/app/data
      - scp_logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - SCP_COGNITIVE_LAYERS=all
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('logs/health.json') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  scp_data:
  scp_logs:
