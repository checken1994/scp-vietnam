# [G5-FIX P0-02] pre-commit config — Layer 1 (mỗi commit, < 30s)
# Previously FABRICATED (doc claimed it existed, file did not). Now real.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll, -q]  # chỉ HIGH+ severity, quiet
        exclude: ^(tests/|scp/tests/)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--select, B,Bugbear,DUO, --max-line-length, 120]
        additional_dependencies: [flake8-bugbear, dlint]

  - repo: local
    hooks:
      - id: protected-paths-check
        name: "[G2] Verify protected paths not modified"
        entry: python3 -c "
import sys, os
from scp.autofix.runner_phases.ast_scan import PROTECTED_PATHS, _is_protected_path
changed = sys.argv[1:]
for f in changed:
    if _is_protected_path(f):
        print(f'BLOCKED: {f} is protected (SCP cannot modify its own permission source)')
        sys.exit(1)
"
        language: system
        pass_filenames: true
