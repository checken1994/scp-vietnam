# ============================================================
# SCP — CI Benchmark (GitHub Actions)
# Chạy sample benchmark + kiểm tra ngưỡng mỗi push/PR/nightly
# ============================================================
name: CI Benchmark

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # 02:00 UTC mỗi ngày
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  SCP_SKIP_STARTUP_GATE: "1"
  SCP_DEV_MODE: "1"
  SCP_EVOLUTION_ENABLED: "0"
  SCP_AUTO_APPROVE_TIER3: "0"
  SCP_ENABLE_POISON_COUNTER: "0"
  SCP_URL: "http://127.0.0.1:8000"
  # Token test — KHÔNG dùng secret production trong CI public
  SCP_AUTH_TOKEN: "scp-ci-test-token"
  SCP_AUTH_TOKEN_SECRET: "scp-ci-test-token"
  PYTHONUNBUFFERED: "1"

jobs:
  benchmark:
    name: Benchmark sample
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests python-dotenv

      - name: Prepare dirs
        run: |
          mkdir -p data logs benchmark_results
          # .env CI — không có key thật; server chạy mode dev
          if [ ! -f .env ]; then
            cat > .env << 'EOF'
          SCP_DEV_MODE=1
          SCP_SKIP_STARTUP_GATE=1
          SCP_AUTH_TOKEN_SECRET=scp-ci-test-token
          SCP_EVOLUTION_ENABLED=0
          SCP_AUTO_APPROVE_TIER3=0
          SCP_ENABLE_POISON_COUNTER=0
          OLLAMA_ENABLED=false
          EOF
          fi

      - name: Start SCP server
        run: |
          # Ưu tiên start_api.py
          if [ -f start_api.py ]; then
            python start_api.py > logs/ci_server.log 2>&1 &
          else
            python -c "import uvicorn; uvicorn.run('scp.api_server:app', host='127.0.0.1', port=8000)" \
              > logs/ci_server.log 2>&1 &
          fi
          echo $! > logs/ci_server.pid
          echo "Server PID=$(cat logs/ci_server.pid)"

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "Server ready after ${i} attempts"
              curl -s http://127.0.0.1:8000/health || true
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start. Log:"
          cat logs/ci_server.log || true
          exit 1

      - name: Run CI benchmark
        run: |
          python scripts/ci_benchmark.py \
            --url "${SCP_URL}" \
            --token "${SCP_AUTH_TOKEN}" \
            --config scripts/ci_thresholds.json \
            --output benchmark_results/ci_latest.json \
            --wait-server 30

      # [ROOT-FIX Task 38-A / Issue 2] DNA #6 Evidence: secret_scan.py +
      # check_tree_sync.py existed as standalone scripts but were NEVER called
      # by CI — they were "PASS" in tests but actually dead in production.
      # Now wired into CI so every push/PR runs them BEFORE results upload.
      - name: Run gates (secret_scan + check_tree_sync)
        run: |
          python secret_scan.py
          python check_tree_sync.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results/
            logs/ci_server.log
          retention-days: 14

      - name: Fail if thresholds not met
        if: failure()
        run: |
          echo "Benchmark không đạt ngưỡng — xem artifact benchmark-results"
          if [ -f benchmark_results/ci_latest.json ]; then
            python -c "import json; d=json.load(open('benchmark_results/ci_latest.json')); print(json.dumps(d.get('checks'), indent=2, ensure_ascii=False))"
          fi
          exit 1
