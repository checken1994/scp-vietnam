# Ruff configuration for SCP Viet Nam

line-length = 120
target-version = "py39"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear (includes B006: mutable default args, B902: blind except)
]
ignore = [
    "E402",   # Module level import not at top of file (needed for sys.path manipulation)
    "E501",   # Line too long (handled by line-length setting)
    "E701",   # Multiple statements on one line (legacy code style)
    # [DNA2-FIX] S-series false positives — Ruff flag quá mức, không phân biệt context
    "S101",   # assert used — intentional in test/debug code (98% false positive)
    "S311",   # random not crypto — SCP uses random for domain selection, not crypto (100% false positive)
    "S603",   # subprocess.run — SCP calls hardcoded tools (ruff/bandit/vulture/git), inputs validated (100% false positive)
    "S607",   # partial executable path — tool existence checked via _check_tool_available() (100% false positive)
    "S608",   # hardcoded SQL — SCP uses hardcoded queries, no user input (100% false positive)
    "S310",   # urlopen — URL scheme validated before call (100% false positive)
    # NOTE: S110, S112, S105, S106 are NOT ignored — they need human review
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F811"]
"scripts/*" = ["E402", "F401", "E701"]
"tests/*" = ["E402", "F401", "S101", "S603", "S607"]  # Tests can use assert + subprocess
